  <text x="150" y="100" font-size="11" fill="#6b7280">纯源码（现状）</text>

  <rect x="46" y="124" width="268" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="50" y="128" width="58" height="18" rx="3" fill="#dbeafe"/>
