<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect x="0" y="0" width="1000" height="470" fill="#f7f9fc"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1f2937">文件：Markdown 三模式（最轻量路径 A）</text>
  <text x="30" y="55" font-size="12" fill="#6b7280">仅对 .md / .markdown 生效；其它文件完全走现有 Monaco 路径，行为零变化</text>

  <!-- 模式 1 -->
  <rect x="30" y="76" width="300" height="270" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="30" y="76" width="300" height="36" rx="10" fill="#eff6ff"/>
