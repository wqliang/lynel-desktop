  <rect x="58" y="264" width="196" height="7" rx="3" fill="#e2e8f0"/>
  <text x="58" y="302" font-size="11" fill="#94a3b8">Ctrl+S · 脏标记 · 草稿，全部沿用</text>

  <!-- 模式 2 -->
  <rect x="350" y="76" width="300" height="270" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="350" y="76" width="300" height="36" rx="10" fill="#eff6ff"/>
  <text x="366" y="100" font-size="14" font-weight="700" fill="#1d4ed8">editor &amp; preview</text>
  <text x="536" y="100" font-size="11" fill="#1d4ed8">推荐默认</text>

  <rect x="366" y="124" width="268" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="370" y="128" width="58" height="18" rx="3" fill="#ffffff"/>
  <text x="380" y="141" font-size="10" fill="#94a3b8">editor</text>
  <rect x="432" y="128" width="92" height="18" rx="3" fill="#dbeafe"/>
  <text x="452" y="141" font-size="10" font-weight="700" fill="#1d4ed8">split</text>
  <rect x="528" y="128" width="92" height="18" rx="3" fill="#ffffff"/>
  <text x="538" y="141" font-size="10" fill="#94a3b8">preview</text>

  <rect x="366" y="160" width="132" height="168" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="376" y="182" font-size="10" fill="#64748b">Monaco</text>
  <rect x="376" y="194" width="104" height="7" rx="3" fill="#cbd5e1"/>
  <rect x="376" y="208" width="88" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="376" y="222" width="112" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="376" y="236" width="76" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="376" y="250" width="100" height="7" rx="3" fill="#e2e8f0"/>

  <rect x="502" y="160" width="132" height="168" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="512" y="182" font-size="10" fill="#64748b">预览（纯 DOM）</text>
  <rect x="512" y="194" width="96" height="12" rx="2" fill="#dbeafe"/>
