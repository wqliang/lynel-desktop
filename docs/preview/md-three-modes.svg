  <!-- 模式 3 -->
  <rect x="670" y="76" width="300" height="270" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="670" y="76" width="300" height="36" rx="10" fill="#eff6ff"/>
  <text x="686" y="100" font-size="14" font-weight="700" fill="#1d4ed8">preview</text>
  <text x="790" y="100" font-size="11" fill="#6b7280">只读渲染结果</text>

  <rect x="686" y="124" width="268" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <rect x="690" y="128" width="58" height="18" rx="3" fill="#ffffff"/>
  <text x="700" y="141" font-size="10" fill="#94a3b8">editor</text>
  <rect x="752" y="128" width="92" height="18" rx="3" fill="#ffffff"/>
  <text x="772" y="141" font-size="10" fill="#94a3b8">split</text>
  <rect x="848" y="128" width="92" height="18" rx="3" fill="#dbeafe"/>
  <text x="862" y="141" font-size="10" font-weight="700" fill="#1d4ed8">preview</text>

  <rect x="686" y="160" width="268" height="168" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="700" y="176" width="150" height="16" rx="2" fill="#dbeafe"/>
  <rect x="700" y="202" width="240" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="700" y="216" width="210" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="700" y="236" width="240" height="38" rx="3" fill="#f1f5f9"/>
  <rect x="700" y="284" width="180" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="700" y="298" width="232" height="7" rx="3" fill="#e2e8f0"/>
  <text x="700" y="320" font-size="10" fill="#94a3b8">Monaco 用 v-show 隐藏，切回需 rAF(layout())</text>

  <!-- 底部：轻量措施 -->
  <rect x="30" y="362" width="940" height="88" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="46" y="386" font-size="13" font-weight="700" fill="#047857">「最轻量 / 最省资源」的 7 条硬措施</text>
  <text x="46" y="408" font-size="11" fill="#065f46">① 零新增依赖（marked + DOMPurify 已在 bundle）　② 零新增 Monaco 实例，共享同一 model　③ 输入 150ms debounce + rAF 合并　④ 同步 parse，无 worker / WASM</text>
  <text x="46" y="428" font-size="11" fill="#065f46">⑤ &gt;200KB / &gt;5000 行降级预览　⑥ editorEl 常驻同一 DOM 节点，只用 v-show 与 CSS 调宽　⑦ 草稿直接取 store.drafts，不额外读文件 / 不走 IPC</text>
  <text x="46" y="442" font-size="11" fill="#065f46">不做：WYSIWYG 富文本引擎、Mermaid、代码块语法高亮、图片上传　｜　必须：DOMPurify 净化（用户 .md 属外部内容）</text>
</svg>
