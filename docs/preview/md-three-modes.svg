  <text x="218" y="141" font-size="10" fill="#94a3b8">preview</text>

  <rect x="46" y="160" width="268" height="168" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="182" font-size="11" fill="#64748b">Monaco（唯一实例）</text>
  <rect x="58" y="194" width="180" height="7" rx="3" fill="#cbd5e1"/>
  <rect x="58" y="208" width="230" height="7" rx="3" fill="#e2e8f0"/>
  <rect x="58" y="222" width="150" height="7" rx="3" fill="#e2e8f0"/>
