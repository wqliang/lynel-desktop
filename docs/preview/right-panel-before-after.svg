  <rect x="104" y="320" width="120" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="104" y="336" width="146" height="10" rx="3" fill="#e2e8f0"/>

  <rect x="284" y="240" width="161" height="138" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
