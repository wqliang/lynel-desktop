  <rect x="30" y="76" width="455" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="30" y="76" width="455" height="38" rx="12" fill="#fef2f2"/>
  <text x="48" y="101" font-size="14" font-weight="700" fill="#b91c1c">现状：Git 埋在 4 层之下</text>

  <rect x="52" y="132" width="411" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
