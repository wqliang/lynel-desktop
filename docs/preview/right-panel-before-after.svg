  <text x="563" y="312" font-size="11" fill="#475569">文件树 + Tab + Monaco</text>
  <text x="563" y="330" font-size="11" fill="#475569">md 三模式预览</text>
  <text x="563" y="354" font-size="11" fill="#94a3b8">（隐藏时仍保活）</text>

  <rect x="748" y="272" width="186" height="128" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="760" y="292" font-size="12" font-weight="600" fill="#1d4ed8">Git 视图（上移主区）</text>
  <text x="760" y="312" font-size="11" fill="#475569">变更清单树 | diff 预览</text>
  <text x="760" y="330" font-size="11" fill="#475569">Pull · Commit · Push</text>
  <text x="760" y="354" font-size="11" fill="#94a3b8">Worktree ▾</text>

  <rect x="537" y="426" width="411" height="34" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="551" y="448" font-size="11" fill="#475569">底部：提交历史 / 项目终端（v-show 常驻，只剩终端 tab）</text>

  <text x="537" y="484" font-size="12" fill="#047857">1 步可见 + 变更数徽章；完整右栏宽度承载双栏 diff</text>
  <rect x="537" y="496" width="411" height="32" rx="6" fill="#ecfdf5"/>
  <text x="551" y="517" font-size="12" font-weight="700" fill="#047857">需补：工具条「展开文件树」按钮（原入口被分段控件替换）</text>

  <text x="30" y="574" font-size="11" fill="#94a3b8">依据：RightWorkspacePane.vue:149 / CodeView.vue:45-46 / BottomPanel.vue:43-58 / stores/files.ts:68 / HomeView.vue:196-207</text>
