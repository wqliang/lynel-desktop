  <rect x="296" y="302" width="128" height="8" rx="3" fill="#e2e8f0"/>

  <rect x="88" y="300" width="369" height="80" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="5 4"/>
  <text x="100" y="322" font-size="12" font-weight="600" fill="#92400e">③ 底部面板（默认折叠，仅露 32px）</text>
  <rect x="100" y="332" width="86" height="26" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="116" y="350" font-size="12" font-weight="700" fill="#b91c1c">④ Git</text>
  <rect x="192" y="332" width="86" height="26" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="208" y="350" font-size="12" fill="#475569">终端</text>
  <text x="288" y="350" font-size="11" fill="#92400e">↑ 唯一入口，藏在这里</text>

  <text x="52" y="418" font-size="12" fill="#b91c1c">收起态：右缘 13px 纯图标，无文字、无变更数徽章</text>
  <text x="52" y="439" font-size="12" fill="#b91c1c">HomeView.vue:196-207「展开 Workspace」按钮已被注释下线</text>
  <text x="52" y="466" font-size="12" fill="#64748b">需连续 4 步：选会话 → 点右栏小图标 → 展开底部条 → 才看到 Git</text>
  <rect x="52" y="484" width="411" height="44" rx="6" fill="#fef2f2"/>
  <text x="66" y="511" font-size="13" font-weight="700" fill="#b91c1c">结果：面积仅 320px 高折叠区，双栏 diff 被挤扁</text>

